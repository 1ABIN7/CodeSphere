spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:codesphere}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Atulanup20}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Storage configuration (dev profile uses local filesystem)
storage:
  active-backend: local
  local:
    root-path: ./storage/uploads
  minio:
    endpoint: http://${MINIO_HOST:localhost}:9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: codesphere-assets

# Judge engine (dev settings)
judge:
  temp-dir: ./judge-temp

logging:
  level:
    root: INFO
    com.codesphere: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
