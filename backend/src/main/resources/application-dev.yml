spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:CodeSphere}?options=-c%20timezone=UTC
    username: ${DB_USERNAME:rahul}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    clean-disabled: false

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

storage:
  active-backend: local
  local:
    root-path: ./storage/uploads

# MinIO Profile Overrides
minio:
  endpoint: http://${MINIO_HOST:127.0.0.1}:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    name: questions-import-vault

judge:
  temp-dir: ./judge-temp

logging:
  level:
    root: INFO
    com.CodeSphere: DEBUG
    org.springframework.security: INFO
    # Keep development startup readable. Set this to DEBUG only while diagnosing a query.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
