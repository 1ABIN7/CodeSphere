spring:
  application:
    name: CodeSphere-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

# Application JWT properties
app:
  jwt:
    secret: dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWNvZGVzcGhlcmUtZGV2ZWxvcG1lbnQtcGxhdGZvcm0tc2VjdXJpdHktdGVzdGluZw==
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days

# Root-level MinIO configuration
minio:
  endpoint: http://${MINIO_HOST:localhost}:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    name: questions-import-vault

cors:
  allowed-origin: "http://localhost:3000"

# Storage configuration
storage:
  active-backend: local
  max-file-size: 52428800 # 50MB
  allowed-content-types:
    - text/plain
    - text/csv
    - application/pdf
    - application/json
    - application/zip
    - image/png
    - image/jpeg

# Judge engine configuration
judge:
  default-time-limit: 2000
  default-memory-limit: 262144
  max-code-length: 65536
  thread-pool-core-size: 4
  thread-pool-max-size: 8
  queue-capacity: 100
  use-docker: false
  supported-languages:
    - java
    - python
    - cpp
    - c
    - javascript

# Security Encryption
security:
  encryption:
    key: "c0deSph3reSecUr1tyK3y2026AES256!"