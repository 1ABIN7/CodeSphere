spring:
  application:
    name: CodeSphere-backend
  config:
    import: optional:file:../.env[.properties]
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope: openid,profile,email

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

# Spring Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: CodeSphere
    description: Coding assessment & interview prep platform
  team:
    p5-devops: Abin

# Application-specific properties
app:
  jwt:
    secret: dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWNvZGVzcGhlcmUtZGV2ZWxvcG1lbnQtcGxhdGZvcm0tc2VjdXJpdHktdGVzdGluZw==
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  oauth2:
    authorized-redirect-uri: ${FRONTEND_URL:http://localhost:5173}/auth/callback

# MinIO Configuration
minio:
  endpoint: http://${MINIO_HOST:localhost}:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    name: ${MINIO_BUCKET_NAME:questions-import-vault}

cors:
  allowed-origin: "http://localhost:3000"

# Storage configuration
storage:
  active-backend: local
  max-file-size: 52428800 # 50MB
  allowed-content-types:
    - text/plain
    - text/csv
    - application/pdf
    - application/json
    - application/zip
    - image/png
    - image/jpeg

# Judge engine configuration
judge:
  default-time-limit: 2000
  default-memory-limit: 262144
  max-code-length: 65536
  thread-pool-core-size: 4
  thread-pool-max-size: 8
  queue-capacity: 100
  use-docker: ${JUDGE_USE_DOCKER:false}
  supported-languages:
    - java
    - python
    - cpp
    - c
    - javascript

# Security Encryption
security:
  encryption:
    key: "c0deSph3reSecUr1tyK3y2026AES256!"
