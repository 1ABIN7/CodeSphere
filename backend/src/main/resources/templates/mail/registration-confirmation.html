<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to CodeSphere</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4;">
    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
        <h2 style="color: #2a3b5c;">Welcome to CodeSphere!</h2>
        <p>Dear <span th:text="${name}">User</span>,</p>
        <p>Your registration on the CodeSphere platform is complete. You can now login, participate in programming assessments, and manage your coding profile.</p>
        <p>Best regards,<br>The CodeSphere Team</p>
    </div>
</body>
</html>
