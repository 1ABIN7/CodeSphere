<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4;">
    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
        <h2 style="color: #2a3b5c;">Reset Password Request</h2>
        <p>Hello,</p>
        <p>A request was received to reset your CodeSphere password. Use the token code below to complete the reset process:</p>
        <p style="font-size: 18px; font-weight: bold; background: #f0f4ff; padding: 10px; text-align: center; border-radius: 4px; color: #2a3b5c;">
            <span th:text="${token}">ResetTokenCode</span>
        </p>
        <p>If you did not request a password reset, please ignore this email.</p>
        <p>Best regards,<br>The CodeSphere Team</p>
    </div>
</body>
</html>
