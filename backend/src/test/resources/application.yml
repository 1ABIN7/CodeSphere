spring:
  application:
    name: CodeSphere-backend-test

  # Switch to an in-memory database configuration for running tests offline
  datasource:
    url: jdbc:h2:mem:CodeSphere_test;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # Creates tables automatically in-memory instead of validating
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false # Turn off Flyway migrations completely during test runs

  # Disable background listeners for messaging integrations during tests
  rabbitmq:
    listener:
      auto-startup: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

# Dummy secret so the JWT component sets up cleanly during context loads
app:
  jwt:
    secret: dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWNvZGVzcGhlcmUtZGV2ZWxvcG1lbnQtcGxhdGZvcm0tc2VjdXJpdHktdGVzdGluZw==
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  oauth2:
    authorized-redirect-uri: http://localhost:5173/oauth2/redirect

# Test-only AES key. Production continues to read this value from its private
# environment configuration.
security:
  encryption:
    key: 01234567890123456789012345678901
