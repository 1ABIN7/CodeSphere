spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:CodeSphere}?options=-c%20timezone=UTC
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Storage configuration (dev profile uses local filesystem)
storage:
  active-backend: local
  local:
    root-path: ./storage/uploads
  minio:
    endpoint: http://${MINIO_HOST:127.0.0.1}:9000
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: CodeSphere-assets

# MinIO Configuration for storing problem assets / testcases if needed (legacy/develop compatibility)
minio:
  endpoint: http://${MINIO_HOST:127.0.0.1}:9000
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: CodeSphere-assets
  bucket-name: questions-import-vault

# Judge engine (dev settings)
judge:
  temp-dir: ./judge-temp

logging:
  level:
    root: INFO
    com.CodeSphere: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
